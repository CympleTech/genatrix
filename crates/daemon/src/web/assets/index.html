<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genatrix</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>Genatrix</h1>
  <nav>
    <button class="tab is-on" data-pane="today">Today</button>
    <button class="tab" data-pane="timeline">Timeline</button>
    <button class="tab" data-pane="people">People</button>
    <button class="tab" data-pane="review">Review</button>
    <button class="tab" data-pane="records">Records</button>
  </nav>
  <p id="status" class="status"></p>
  <ul id="accounts" class="accounts"></ul>
</header>

<main>
  <section id="today" class="pane is-on">
    <p id="digest-headline" class="headline"></p>
    <div id="digest"></div>
    <h2 class="group-title">You promised</h2>
    <ol id="commitments" class="rows"></ol>
    <p id="commitments-empty" class="empty" hidden></p>
  </section>

  <section id="timeline" class="pane">
    <form id="filters" autocomplete="off">
      <input id="q" type="search" placeholder="Search mail and messages">
      <select id="level">
        <option value="">Any sensitivity</option>
        <option value="public">Public</option>
        <option value="personal">Personal</option>
        <option value="secret">Secret</option>
      </select>
      <select id="connector">
        <option value="">Any source</option>
        <option value="imap">Mail</option>
        <option value="telegram">Telegram</option>
      </select>
    </form>
    <ol id="rows" class="rows"></ol>
    <p id="timeline-empty" class="empty" hidden></p>
  </section>

  <section id="people" class="pane">
    <div class="people-layout">
      <ol id="people-list" class="people"></ol>
      <div id="person" class="person">
        <p class="empty">Pick someone on the left.</p>
      </div>
    </div>
  </section>

  <section id="review" class="pane">
    <p id="tally" class="headline"></p>
    <p class="note">The model's judgement of a message, for you to confirm or correct. Your answer is
      recorded as yours and wins; what the model said stays on the record. Twenty at a time,
      drawn at random from what you have not looked at.</p>
    <ol id="review-rows" class="rows"></ol>
    <p id="review-empty" class="empty" hidden></p>
    <p><button id="review-more" class="tab" type="button">Another twenty</button></p>
  </section>

  <section id="records" class="pane">
    <p id="headline" class="headline"></p>
    <p id="chain" class="note"></p>
    <ol id="calls" class="rows"></ol>
    <p id="records-empty" class="empty" hidden></p>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>

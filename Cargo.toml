[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cympletech/genatrix"
authors = ["CympleTech <hi@cympletech.com>"]
rust-version = "1.85"

[workspace.dependencies]
genatrix-model = { path = "crates/model" }
genatrix-store = { path = "crates/store" }
genatrix-ledger = { path = "crates/ledger" }
genatrix-gate = { path = "crates/gate" }
genatrix-agent = { path = "crates/agent" }
genatrix-profile = { path = "crates/profile" }
genatrix-llm = { path = "crates/llm" }
genatrix-connector = { path = "crates/connector" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

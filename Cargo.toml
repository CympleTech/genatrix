[workspace]
resolver = "3"
members = [
    "crates/agent",
    "crates/connectors/github",
    "crates/connectors/imap",
    "crates/connectors/protocol",
    "crates/connectors/telegram",
    "crates/daemon",
    "crates/dispatch",
    "crates/exec",
    "crates/gate",
    "crates/host",
    "crates/infer",
    "crates/keys",
    "crates/ledger",
    "crates/llm",
    "crates/model",
    "crates/profile",
    "crates/store",
    "crates/vec",
]
exclude = ["vendor"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cympletech/genatrix"
authors = ["CympleTech <hi@cympletech.com>"]
rust-version = "1.88"

[workspace.dependencies]
genatrix-model = { path = "crates/model" }
genatrix-keys = { path = "crates/keys" }
genatrix-vec = { path = "crates/vec" }
genatrix-store = { path = "crates/store" }
genatrix-ledger = { path = "crates/ledger" }
genatrix-gate = { path = "crates/gate" }
genatrix-agent = { path = "crates/agent" }
genatrix-profile = { path = "crates/profile" }
genatrix-llm = { path = "crates/llm" }
genatrix-connector = { path = "crates/connectors/protocol" }
genatrix-connector-imap = { path = "crates/connectors/imap" }
genatrix-connector-telegram = { path = "crates/connectors/telegram" }
genatrix-host = { path = "crates/host" }
genatrix-dispatch = { path = "crates/dispatch" }
genatrix-exec = { path = "crates/exec" }
genatrix-connector-github = { path = "crates/connectors/github" }

# vendored crabllm (see vendor/crabllm/GENATRIX-VENDOR.md)
crabllm-core = { path = "vendor/crabllm/crates/core" }
crabllm-provider = { path = "vendor/crabllm/crates/provider", default-features = false, features = ["hyper", "native-tls"] }
crabllm-mlx = { path = "vendor/crabllm/crates/mlx" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
hmac = "0.12"
rand = "0.9"
subtle = "2"
base64 = "0.22"
bytes = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures = "0.3"
axum = { version = "0.8", features = ["json"] }
clap = { version = "4", features = ["derive"] }
toml = "0.9"
regex = "1"
hex = "0.4"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "hooks", "limits"] }
tempfile = "3"
wasmtime = { version = "49", default-features = false, features = ["cranelift", "component-model", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
wasmtime-wasi-io = { version = "49", default-features = false }
wasmparser = "0.240"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# A fake or an in-memory implementation of an async trait answers at once;
# `async fn` is still the plain way to write it.
unused_async_trait_impl = "allow"
# New in rustc 1.99's clippy. The suggested `assert_eq!(v, [] as [T; 0])`
# needs `PartialEq` on every element type for a message the test name
# already gives.
assert_is_empty = "allow"

# Carried with one patch until upstream ships the accessor; see
# vendor/async-imap/GENATRIX-VENDOR.md.
[patch.crates-io]
async-imap = { path = "vendor/async-imap" }

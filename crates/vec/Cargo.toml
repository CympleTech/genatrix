[package]
name = "genatrix-vec"
description = "Registers the sqlite-vec extension for the store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
rusqlite.workspace = true
sqlite-vec = "0.1.6"

# The workspace forbids unsafe code. This crate is the one place that needs
# a single unsafe block, so it carries the same lints with that one at
# `deny`, which the block overrides where it explains itself.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

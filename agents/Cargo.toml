# Guest code for functional agents (design 11). A workspace of its own:
# everything here is built for wasm32-wasip2 and runs inside the core's
# sandbox, never in the core itself.
[workspace]
resolver = "3"
members = ["sdk", "hello", "extract", "nz-tax/taxcore", "nz-tax/taxrules", "nz-tax/agent", "probes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
genatrix-agent-sdk = { path = "sdk" }
wit-bindgen = "0.62"
taxcore = { path = "nz-tax/taxcore" }
taxrules = { path = "nz-tax/taxrules" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
